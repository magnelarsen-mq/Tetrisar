<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#030712">
<title>Tetrisar XR – Quest</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas{display:block}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
#menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,620px);padding:26px;border-radius:24px;text-align:center;background:rgba(6,11,27,.94);border:1px solid rgba(100,225,255,.32);box-shadow:0 0 50px rgba(60,190,255,.17);pointer-events:auto}
h1{margin:0 0 8px;font-size:34px}p{line-height:1.45;opacity:.84}
.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:15px;padding:14px 19px;font-size:16px;font-weight:800;background:#ecfbff;color:#07101d;cursor:pointer}
button.alt{background:#18213a;color:#e8fbff;border:1px solid rgba(100,225,255,.3)}
button:disabled{opacity:.35}
#status{margin-top:15px;font-size:13px;white-space:pre-line;color:#aeeeff}
#hud{position:absolute;left:14px;top:14px;padding:11px 15px;border-radius:14px;background:rgba(0,0,0,.48);backdrop-filter:blur(8px);font-weight:700}
#exit{position:absolute;right:14px;top:14px;display:none;pointer-events:auto}
</style>
</head>
<body>
<div id="ui">
  <div id="hud">TETRISAR XR<br>Poeng <span id="score">0</span> · Linjer <span id="lines">0</span> · Nivå <span id="level">1</span></div>
  <button id="exit" class="alt">Avslutt XR</button>
  <div id="menu">
    <h1>TETRISAR XR</h1>
    <p>Quest-utgave med passthrough AR, 360° stjernearena, blanke 3D-klosser, kontrollerstyring, fallende tetrominoer rundt spilleren og synth-versjon av den klassiske Tetris-melodien.</p>
    <div class="buttons">
      <button id="ar" disabled>Start AR</button>
      <button id="vr" disabled>Start 360° VR</button>
      <button id="flat" class="alt">Test 3D uten XR</button>
    </div>
    <div id="status">Tester WebXR …</div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js"}}
</script>

<script type="module">
import * as THREE from 'three';

/* Remove old PWA/service-worker cache from previous versions of this project.
   This stops an old cached index.html from taking over the GitHub Pages scope. */
(async()=>{
  try{
    const regs=await navigator.serviceWorker?.getRegistrations?.();
    if(regs) for(const r of regs) await r.unregister();
    if(window.caches){
      for(const k of await caches.keys()) if(k.startsWith('star-tetris')||k.startsWith('tetrisar')) await caches.delete(k);
    }
  }catch(e){}
})();

const statusEl=document.getElementById('status');
const arBtn=document.getElementById('ar');
const vrBtn=document.getElementById('vr');
const flatBtn=document.getElementById('flat');
const menu=document.getElementById('menu');
const exitBtn=document.getElementById('exit');

function status(s){statusEl.textContent=s}

/* IMPORTANT: feature detection is done BEFORE the user clicks Start.
   The actual click handler calls requestSession immediately. */
let arOK=false, vrOK=false;
async function preflight(){
  if(!window.isSecureContext){
    status('WebXR krever HTTPS. Åpne GitHub Pages-adressen, ikke github.com/blob.');
    return;
  }
  if(!navigator.xr){
    status('navigator.xr finnes ikke. Åpne siden direkte i Meta Quest Browser.');
    return;
  }
  try{
    [arOK,vrOK]=await Promise.all([
      navigator.xr.isSessionSupported('immersive-ar'),
      navigator.xr.isSessionSupported('immersive-vr')
    ]);
    arBtn.disabled=!arOK;
    vrBtn.disabled=!vrOK;
    status(`WebXR OK\nAR: ${arOK?'JA':'NEI'} · 360° VR: ${vrOK?'JA':'NEI'}`);
  }catch(e){
    status('WebXR-test feilet: '+e.message);
  }
}
preflight();

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x02040b);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,100);
camera.position.set(0,1.6,1.4);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xeaffff,0x18233e,2.4));
const a=new THREE.PointLight(0x5de9ff,30,16,2);a.position.set(-1.5,2.4,.5);scene.add(a);
const b=new THREE.PointLight(0xff5de1,24,16,2);b.position.set(1.5,1.7,-1);scene.add(b);

/* ---------- 360 environment ---------- */
const starPos=[];
for(let i=0;i<2600;i++){
  const r=THREE.MathUtils.randFloat(8,34),u=Math.random(),v=Math.random();
  const th=2*Math.PI*u,ph=Math.acos(2*v-1);
  starPos.push(r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph),r*Math.sin(ph)*Math.sin(th));
}
const sg=new THREE.BufferGeometry();
sg.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));
const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.045,transparent:true,opacity:.95}));
scene.add(stars);

const floor=new THREE.Mesh(
  new THREE.CircleGeometry(3.8,80),
  new THREE.MeshPhysicalMaterial({color:0x071426,roughness:.12,metalness:.6,clearcoat:1,emissive:0x081a31,emissiveIntensity:.35})
);
floor.rotation.x=-Math.PI/2;floor.visible=false;scene.add(floor);
const ring=new THREE.Mesh(
  new THREE.RingGeometry(3.55,3.78,96),
  new THREE.MeshBasicMaterial({color:0x66eaff,side:THREE.DoubleSide,transparent:true,opacity:.75})
);
ring.rotation.x=-Math.PI/2;ring.position.y=.008;ring.visible=false;scene.add(ring);

/* ---------- Tetris ---------- */
const COLS=10,ROWS=20,CELL=.042,W=COLS*CELL,H=ROWS*CELL;
const COLORS={I:0x27dbff,J:0x536cff,L:0xff9a31,O:0xffe13f,S:0x43e87d,T:0xc65cff,Z:0xff4d68};
const SHAPES={
 I:[[1,1,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]],O:[[1,1],[1,1]],
 S:[[0,1,1],[1,1,0]],T:[[0,1,0],[1,1,1]],Z:[[1,1,0],[0,1,1]]
};
const boardRoot=new THREE.Group();
boardRoot.position.set(-W/2,1.16,-1.1);
scene.add(boardRoot);
const back=new THREE.Mesh(new THREE.PlaneGeometry(W+.07,H+.07),
 new THREE.MeshBasicMaterial({color:0x020712,transparent:true,opacity:.80,side:THREE.DoubleSide}));
back.position.set(W/2-CELL/2,H/2-CELL/2,-.04);boardRoot.add(back);
const frame=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(W+.075,H+.075)),
 new THREE.LineBasicMaterial({color:0x66eaff}));
frame.position.copy(back.position);frame.position.z=-.035;boardRoot.add(frame);

const geo=new THREE.BoxGeometry(CELL*.9,CELL*.9,CELL*.76);
function block(type,alpha=1){
  return new THREE.Mesh(geo,new THREE.MeshPhysicalMaterial({
    color:COLORS[type],transparent:alpha<1,opacity:alpha,roughness:.055,metalness:.26,
    clearcoat:1,clearcoatRoughness:.025,emissive:COLORS[type],emissiveIntensity:.17
  }));
}
const locked=new THREE.Group(),activeGroup=new THREE.Group(),fx=new THREE.Group();
boardRoot.add(locked,activeGroup,fx);

let board,active,score=0,lines=0,level=1,dropDelay=650,lastDrop=0,over=false;
function rnd(){
 const ks=Object.keys(SHAPES),type=ks[Math.floor(Math.random()*ks.length)],matrix=SHAPES[type].map(r=>[...r]);
 return{type,matrix,x:Math.floor((COLS-matrix[0].length)/2),y:ROWS-matrix.length};
}
function rot(m){return m[0].map((_,i)=>m.map(r=>r[i]).reverse())}
function collision(p,dx=0,dy=0,m=p.matrix){
 for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c]){
   const x=p.x+c+dx,y=p.y+(m.length-1-r)+dy;
   if(x<0||x>=COLS||y<0)return true;
   if(y<ROWS&&board[y][x])return true;
 }
 return false;
}
function redrawLocked(){
 locked.clear();
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(board[y][x]){
   const m=block(board[y][x]);m.position.set(x*CELL,y*CELL,0);locked.add(m);
 }
}
function redrawActive(){
 activeGroup.clear();if(!active)return;
 let ghostY=active.y;
 while(!collision({...active,y:ghostY},0,-1))ghostY--;
 for(let r=0;r<active.matrix.length;r++)for(let c=0;c<active.matrix[r].length;c++)if(active.matrix[r][c]){
   const y=ghostY+(active.matrix.length-1-r);
   const g=block(active.type,.16);g.position.set((active.x+c)*CELL,y*CELL,-.006);activeGroup.add(g);
 }
 for(let r=0;r<active.matrix.length;r++)for(let c=0;c<active.matrix[r].length;c++)if(active.matrix[r][c]){
   const m=block(active.type);m.position.set((active.x+c)*CELL,(active.y+active.matrix.length-1-r)*CELL,0);activeGroup.add(m);
 }
}
function burst(y){
 for(let i=0;i<30;i++){
   const p=new THREE.Mesh(new THREE.SphereGeometry(.007,6,6),
     new THREE.MeshBasicMaterial({color:[0xffffff,0x66eaff,0xff69df,0xffdd55][i%4],transparent:true}));
   p.position.set(Math.random()*W,y*CELL,0);
   p.userData.v=new THREE.Vector3((Math.random()-.5)*.018,Math.random()*.02+.006,(Math.random()-.5)*.018);
   p.userData.life=1;fx.add(p);
 }
}
function clearRows(){
 let n=0;
 for(let y=0;y<ROWS;y++)if(board[y].every(Boolean)){
   burst(y);board.splice(y,1);board.push(Array(COLS).fill(null));y--;n++;
 }
 if(n){
   score+=([0,100,300,500,800][n]||n*250)*level;lines+=n;level=Math.floor(lines/10)+1;
   dropDelay=Math.max(125,650-(level-1)*48);hud();
 }
}
function spawn(){active=rnd();if(collision(active)){over=true;return}redrawActive()}
function lock(){
 for(let r=0;r<active.matrix.length;r++)for(let c=0;c<active.matrix[r].length;c++)if(active.matrix[r][c]){
   const x=active.x+c,y=active.y+(active.matrix.length-1-r);if(y>=ROWS){over=true;return}board[y][x]=active.type;
 }
 clearRows();redrawLocked();spawn();
}
function move(dx){if(!over&&!collision(active,dx,0)){active.x+=dx;redrawActive()}}
function down(){if(over)return;if(!collision(active,0,-1)){active.y--;score++;hud();redrawActive()}else lock()}
function drop(){if(over)return;let d=0;while(!collision(active,0,-1)){active.y--;d++}score+=d*2;hud();lock()}
function rotate(){
 if(over)return;const m=rot(active.matrix);
 if(!collision(active,0,0,m)){active.matrix=m}
 else if(!collision(active,-1,0,m)){active.x--;active.matrix=m}
 else if(!collision(active,1,0,m)){active.x++;active.matrix=m}else return;
 redrawActive();
}
function hud(){
 scoreEl.textContent=score;linesEl.textContent=lines;levelEl.textContent=level;
}
const scoreEl=document.getElementById('score'),linesEl=document.getElementById('lines'),levelEl=document.getElementById('level');
function reset(){
 board=Array.from({length:ROWS},()=>Array(COLS).fill(null));score=lines=0;level=1;dropDelay=650;over=false;
 locked.clear();activeGroup.clear();hud();spawn();
}
reset();

/* ---------- world tetromino rain ---------- */
const rain=new THREE.Group();scene.add(rain);rain.visible=false;
function worldPiece(){
 const ks=Object.keys(SHAPES),type=ks[Math.floor(Math.random()*ks.length)],g=new THREE.Group(),s=.075,m=SHAPES[type];
 for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c]){
   const q=new THREE.Mesh(new THREE.BoxGeometry(s*.9,s*.9,s*.9),new THREE.MeshPhysicalMaterial({
     color:COLORS[type],roughness:.04,metalness:.32,clearcoat:1,clearcoatRoughness:.02,emissive:COLORS[type],emissiveIntensity:.2
   }));
   q.position.set((c-(m[0].length-1)/2)*s,((m.length-1-r)-(m.length-1)/2)*s,0);g.add(q);
 }
 const rr=THREE.MathUtils.randFloat(1.5,3.4),aa=Math.random()*Math.PI*2;
 g.position.set(Math.cos(aa)*rr,THREE.MathUtils.randFloat(2.2,4),Math.sin(aa)*rr);
 g.userData.speed=THREE.MathUtils.randFloat(.004,.012);
 g.userData.spin=new THREE.Vector3(THREE.MathUtils.randFloat(-.02,.02),THREE.MathUtils.randFloat(-.025,.025),THREE.MathUtils.randFloat(-.02,.02));
 return g;
}
for(let i=0;i<28;i++)rain.add(worldPiece());

/* ---------- XR controllers + floating control panel ---------- */
const interactive=[];
const panel=new THREE.Group();panel.position.set(W/2+.31,1.37,-1.08);scene.add(panel);
function tex(text){
 const c=document.createElement('canvas');c.width=640;c.height=170;const x=c.getContext('2d');
 x.fillStyle='#101a31';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#62eaff';x.lineWidth=7;x.strokeRect(5,5,630,160);
 x.fillStyle='#f2fdff';x.font='700 55px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(text,320,85);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function control(text,y,fn){
 const o=new THREE.Mesh(new THREE.PlaneGeometry(.245,.078),new THREE.MeshBasicMaterial({map:tex(text)}));
 o.position.y=y;o.userData.fn=fn;panel.add(o);interactive.push(o);
}
control('◀ VENSTRE',.19,()=>move(-1));control('↻ ROTER',.095,rotate);control('▼ NED',0,down);
control('▶ HØYRE',-.095,()=>move(1));control('⤓ DROP',-.19,drop);control('RESET',-.295,reset);

const raycaster=new THREE.Raycaster(),tmp=new THREE.Matrix4(),controllers=[];
function hit(c){
 tmp.identity().extractRotation(c.matrixWorld);
 raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);raycaster.ray.direction.set(0,0,-1).applyMatrix4(tmp);
 return raycaster.intersectObjects(interactive,false)[0];
}
for(let i=0;i<2;i++){
 const c=renderer.xr.getController(i);
 const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1)]),new THREE.LineBasicMaterial({color:0x75efff}));
 line.scale.z=3;c.add(line);scene.add(c);
 c.addEventListener('selectend',()=>{const h=hit(c);if(h?.object.userData.fn)h.object.userData.fn()});
 controllers.push(c);
}
const gpMemory=[{t:0,b:[]},{t:0,b:[]}];
function gamepads(now){
 const s=renderer.xr.getSession();if(!s)return;
 let i=0;
 for(const src of s.inputSources){
   const gp=src.gamepad;if(!gp||i>1){i++;continue}
   const ax=gp.axes||[],x=ax.length>=4?ax[2]:(ax[0]||0),y=ax.length>=4?ax[3]:(ax[1]||0);
   if(now-gpMemory[i].t>180){
     if(x<-.65){move(-1);gpMemory[i].t=now}else if(x>.65){move(1);gpMemory[i].t=now}else if(y>.65){down();gpMemory[i].t=now}
   }
   gp.buttons.forEach((bt,k)=>{
     const prev=gpMemory[i].b[k]||false;
     if(bt.pressed&&!prev){if(k===4||k===5)rotate();if(k===1||k===3)drop()}
     gpMemory[i].b[k]=bt.pressed;
   });i++;
 }
}

/* ---------- music ---------- */
let ac=null,music=false,timer=null;
function note(semi,oct=4){const midi=12*(oct+1)+semi;return 440*Math.pow(2,(midi-69)/12)}
const tune=[
 [note(4,5),.22],[note(11,4),.11],[note(0,5),.11],[note(2,5),.22],[note(0,5),.11],[note(11,4),.11],[note(9,4),.22],
 [note(9,4),.11],[note(0,5),.11],[note(4,5),.22],[note(2,5),.11],[note(0,5),.11],[note(11,4),.33],[0,.11],
 [note(0,5),.22],[note(2,5),.11],[note(4,5),.22],[note(0,5),.22],[note(9,4),.22],[0,.08],
 [note(2,5),.22],[note(5,5),.22],[note(9,5),.33],[0,.12],
 [note(7,5),.22],[note(5,5),.11],[note(4,5),.22],[note(2,5),.11],[note(4,5),.11],[note(0,5),.22],
 [note(0,5),.11],[note(2,5),.11],[note(4,5),.22],[note(0,5),.22],[note(2,5),.33],[0,.12]
];
function musicStart(){
 if(music)return;music=true;
 ac ||= new (window.AudioContext||window.webkitAudioContext)();ac.resume();
 const master=ac.createGain();master.gain.value=.08;master.connect(ac.destination);
 const playLoop=()=>{
   let at=ac.currentTime+.03;
   for(const [f,d] of tune){
     if(f){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;
       g.gain.setValueAtTime(.001,at);g.gain.exponentialRampToValueAtTime(.11,at+.01);g.gain.exponentialRampToValueAtTime(.001,at+d-.015);
       o.connect(g).connect(master);o.start(at);o.stop(at+d)}
     at+=d;
   }
 };
 playLoop();timer=setInterval(playLoop,6300);
}
function musicStop(){if(timer)clearInterval(timer);timer=null;music=false}

/* ---------- DIRECT XR SESSION START ---------- */
let currentSession=null,currentMode='none';

function beginXR(mode){
  // Do NOT await anything before requestSession: this call is made directly by the user's click.
  if(!navigator.xr){status('WebXR mangler.');return}
  status('Starter '+(mode==='immersive-ar'?'AR …':'360° VR …'));
  navigator.xr.requestSession(mode,{optionalFeatures:['local-floor','hand-tracking']})
    .then(async s=>{
      currentSession=s;currentMode=mode;
      await renderer.xr.setSession(s);
      menu.style.display='none';exitBtn.style.display='block';
      musicStart();

      if(mode==='immersive-ar'){
        scene.background=null;stars.visible=false;floor.visible=false;ring.visible=false;rain.visible=false;
        boardRoot.position.set(-W/2,1.14,-1.0);panel.position.set(W/2+.31,1.36,-.98);
      }else{
        scene.background=new THREE.Color(0x02040b);stars.visible=true;floor.visible=true;ring.visible=true;rain.visible=true;
        boardRoot.position.set(-W/2,1.17,-1.35);panel.position.set(W/2+.31,1.38,-1.32);
      }

      s.addEventListener('end',()=>{
        currentSession=null;currentMode='none';menu.style.display='block';exitBtn.style.display='none';
        scene.background=new THREE.Color(0x02040b);stars.visible=true;floor.visible=false;ring.visible=false;rain.visible=false;musicStop();
      },{once:true});
    })
    .catch(e=>status('XR-start feilet:\n'+e.name+': '+e.message));
}
arBtn.addEventListener('click',()=>beginXR('immersive-ar'));
vrBtn.addEventListener('click',()=>beginXR('immersive-vr'));
exitBtn.addEventListener('click',()=>currentSession?.end());

flatBtn.addEventListener('click',()=>{
 menu.style.display='none';stars.visible=true;floor.visible=true;ring.visible=true;rain.visible=true;musicStart();
 boardRoot.position.set(-W/2,1.17,-1.35);panel.position.set(W/2+.31,1.38,-1.32);
});

addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowDown')down();
 else if(e.key==='ArrowUp'||e.key===' ')rotate();else if(e.key.toLowerCase()==='x')drop();else if(e.key.toLowerCase()==='r')reset();
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

renderer.setAnimationLoop(t=>{
 if(!over&&active&&t-lastDrop>dropDelay){lastDrop=t;if(!collision(active,0,-1)){active.y--;redrawActive()}else lock()}
 if(renderer.xr.isPresenting)gamepads(t);
 stars.rotation.y+=.00017;ring.rotation.z+=.0014;

 for(let i=fx.children.length-1;i>=0;i--){
   const p=fx.children[i];p.position.add(p.userData.v);p.userData.v.y-=.00035;p.userData.life-=.025;p.material.opacity=Math.max(0,p.userData.life);
   if(p.userData.life<=0){fx.remove(p);p.geometry.dispose();p.material.dispose()}
 }
 if(rain.visible){
   for(const q of rain.children){
     q.position.y-=q.userData.speed;q.rotation.x+=q.userData.spin.x;q.rotation.y+=q.userData.spin.y;q.rotation.z+=q.userData.spin.z;
     if(q.position.y<-.35){
       const rr=THREE.MathUtils.randFloat(1.5,3.4),aa=Math.random()*Math.PI*2;
       q.position.set(Math.cos(aa)*rr,THREE.MathUtils.randFloat(2.5,4.2),Math.sin(aa)*rr);
     }
   }
 }
 renderer.render(scene,camera);
});
</script>
</body>
</html>
